<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Force Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="simulation-container"></div>
    <div id="toolbar">
        <div id="tool-select">
            <button class="tool-btn" data-tool="wood">Wood</button>
            <button class="tool-btn" data-tool="steel">Steel</button>
            <button class="tool-btn" data-tool="road">Road</button>
        </div>
        <div id="sim-controls">
            <button id="simulate-btn">Simulate</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div id="budget-display">
            Budget: $<span id="budget">10000</span>
        </div>
        <div id="levels-container">
            <h3>Levels</h3>
            <select id="level-select">
                <option value="0">Custom</option>
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
            </select>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.17.1/matter.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
